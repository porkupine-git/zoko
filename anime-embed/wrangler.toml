name = "anime-embed"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Custom Domain for anixo.buzz (attach via Dashboard or delete conflicting DNS A/CNAME first)
# routes = [
#   { pattern = "anixo.buzz", custom_domain = true }
# ]

[placement]
mode = "smart"

[observability]
enabled = true

# Direct 0ms in-memory Edge Service Bindings to the 3 Engines
[[services]]
binding = "MEGAPLAY_SERVICE"
service = "aniko-backend"

[[services]]
binding = "ANINEKO_SERVICE"
service = "anineko-api"

[[services]]
binding = "ZOKO_SERVICE"
service = "zoko-stream"

# Persistent Cloudflare KV Database for Admin Config, Firewall, and Keys
[[kv_namespaces]]
binding = "ANIXO_ADMIN_STORE"
id = "d8743d081b64441099d52e9e175268b1"
