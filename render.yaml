services:
  - type: web
    name: zoko-anime-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: HOST
        value: 0.0.0.0
      - key: RATE_LIMIT_MAX
        value: 300
      - key: CACHE_TTL_MS
        value: 300000
      - key: CACHE_MAX_ITEMS
        value: 5000
      - key: ZOKO_BASE_URL
        value: https://zokoanime.video
      - key: ANILIST_GRAPHQL_ENDPOINT
        value: https://graphql.anilist.co
